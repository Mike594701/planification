        </div>
</div>
<script>

(function() {

    /* ============================================================
       CHARGEMENT FACTORISÉ CSS + JS
    ============================================================ */
    function loadResource(url, callback) {
        const isCSS = url.endsWith('.css');
        const selector = isCSS ? `link[href="${url}"]` : `script[src="${url}"]`;

        // Déjà chargé ?
        if (document.querySelector(selector)) {
            if (callback) callback();
            return;
        }
        let el;
        if (isCSS) {
            el = document.createElement('link');
            el.rel = 'stylesheet';
            el.type = 'text/css';
            el.href = url;
        } else {
            el = document.createElement('script');
            el.src = url;
            el.async = true;
        }

        el.onload = function() {
            if (callback) callback();
        };

        el.onerror = function() {
            console.error("Erreur chargement :", url);
        };

        document.head.appendChild(el);
    }

    /* ============================================================
       ATTENTE DES FONCTIONS NÉCESSAIRES
    ============================================================ */
    function waitForFunctions(required, callback, attempt = 0) {
        const ready = required.every(fn => typeof window[fn] === 'function');
        if (ready) {
            callback();
        } else if (attempt < 200) { // 10 secondes max
            setTimeout(function() {
                waitForFunctions(required, callback, attempt + 1);
            }, 50);
        } else {
            console.error("Timeout : fonctions non disponibles :", required);
        }
    }

    /* ============================================================
       CHARGEMENT CSS → JS → ATTENTE → AFFICHAGE WIDGET
    ============================================================ */
    loadResource('plugins/planification/core/template/dashboard/css/widget.css', function() {
        loadResource('plugins/planification/core/template/dashboard/js/widget.js', function() {
            waitForFunctions(
                [
                    'Affichage_widget',
                    'Commun_widget',
                    'SetWidget_Thermostat',
                    'Maj_Thermostat'
                ],
                function() {
                    var cmds_id = {
                        premier_affichage: '#premier_affichage#',
                        nom_eqlogic:'#nom_eqlogic#',
                        auto_id: '#auto_id#',
                        eqLogic_id: '#id#',
                        eqLogic_uid:'#uid#',
                        mode: '#mode#',
                        mode_id: '#mode_id#',
                        mode_planification : '#mode_planification#',
                        etat: '#etat#',
                        etat_id: '#etat_id#',
                        action_en_cours:'#action_en_cours#',
                        action_en_cours_id:'#action_en_cours_id#',
                        action_suivante:'#action_suivante#',
                        action_suivante_id:'#action_suivante_id#',
                        calendar_selector: '#calendar_selector#',
                        heure_fin: '#heure_fin#',
                        heure_fin_id: '#heure_fin_id#',
                        affichage_heure: '#affichage_heure#',
                        planification_en_cours : '#planification_en_cours#',
                        planification_en_cours_id: '#planification_en_cours_id#',
                        set_heure_fin_id: '#set_heure_fin_id#',
                        set_planification_id: '#set_planification_id#',
                        consigne_temperature: '#consigne_temperature#',
                        consigne_temperature_id: '#consigne_temperature_id#',
                        temperature_ambiante : '#temperature_ambiante#',
                        temperature_ambiante_id : '#temperature_ambiante_id#',
                        consigne_min: '#consigne_min#',
                        consigne_max: '#consigne_max#',
                        set_consigne_temperature_id: '#set_consigne_temperature_id#',
                        set_consigne_temperature_zwave_id: '#set_consigne_temperature_zwave_id#',
                        confort_id: '#confort_id#',
                        eco_id : '#eco_id#',
                        arret_id : '#arret_id#',
                        temp_ext_id : '#temp_ext_id#',
                        hygrometrie_id : '#hygrometrie_id#',
                        pourcentage_ouverture: '#pourcentage_ouverture#',
                        pourcentage_ouverture_id: '#pourcentage_ouverture_id#',
                        pourcentage_batterie: '#pourcentage_batterie#',
                        pourcentage_batterie_id: '#pourcentage_batterie_id#'
                    };

                    // Appel final
                    Affichage_widget('#type_equipement#', cmds_id);
                }
            );
        });
    });
})();      

</script>
